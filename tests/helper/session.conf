<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- tests/run-helper.sh's private bus: a session-type bus on a socket in the run's own
     directory (given with address=), no service activation, no system or user policy
     included. The connections are this user's processes only. -->
<busconfig>
  <type>session</type>
  <!-- Replaced by the runner's address= (a socket in its directory); one is required here -->
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
